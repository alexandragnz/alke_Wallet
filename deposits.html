<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Depositar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./assets/css/index.css">
</head>
<body class="deposits-page">
    <div class="container">
        <!-- Balance Card -->
        <div class="balance-display">
            <p>Saldo Actual</p>
            <h3 id="currentBalance">$0.00</h3>
        </div>

        <!-- Deposit Form Card -->
        <div class="card">
            <div class="card-header">
                <h2 class="mb-0">
                    <i class="bi bi-cash-coin"></i>
                    Depositar
                </h2>
            </div>
            <div class="card-body">
                <form id="depositForm">
                    <div class="form-group mb-3">
                        <label for="depositAmount" class="form-label">Monto a depositar:</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input 
                                type="number" 
                                class="form-control" 
                                id="depositAmount" 
                                placeholder="Ingresa el monto"
                                step="0.01"
                                min="1"
                                required
                            >
                        </div>
                    </div>

                    <!-- Quick Amount Buttons -->
                    <div class="mb-4">
                        <label class="form-label">Montos rápidos:</label>
                        <div class="row g-2">
                            <div class="col-3">
                                <button type="button" class="btn btn-outline-primary w-100" onclick="setAmount(100)">$100</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-outline-primary w-100" onclick="setAmount(500)">$500</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-outline-primary w-100" onclick="setAmount(1000)">$1,000</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-outline-primary w-100" onclick="setAmount(5000)">$5,000</button>
                            </div>
                        </div>
                    </div>

                    <!-- Summary -->
                    <div class="alert alert-light border" style="border-radius: 12px;">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Saldo actual:</span>
                            <strong id="summaryCurrentBalance">$0.00</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Monto a depositar:</span>
                            <strong class="text-success" id="summaryDepositAmount">$0.00</strong>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <strong>Nuevo saldo:</strong>
                            <strong class="text-primary" id="summaryNewBalance">$0.00</strong>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-2">
                        <i class="bi bi-check-circle me-2"></i>Realizar depósito
                    </button>
                </form>
                
                <a href="menu.html" class="btn btn-secondary btn-lg w-100">
                    <i class="bi bi-arrow-left me-2"></i>Volver al Menú Principal
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./deposits.js"></script>
</body>
</html>
