<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Últimos Movimientos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./assets/css/index.css">
</head>
<body class="sendmoney-page">
    <div class="container-fluid" style="max-width: 1200px;">
        <!-- Balance Card -->
        <div class="balance-display">
            <p>Saldo Disponible</p>
            <h3 id="currentBalance">$0.00</h3>
        </div>

        <div class="row">
            <!-- Left Column - Transaction List -->
            <div class="col-lg-7">
                <h2 class="mb-3">
                    <i class="bi bi-clock-history"></i>
                    Últimos Movimientos
                </h2>

                <!-- Transaction List -->
                <ul class="list-group" id="transactionList">
                    <!-- Las transacciones se cargarán dinámicamente aquí -->
                </ul>

                <!-- No transactions message -->
                <div id="emptyState" class="text-center py-5" style="display: none;">
                    <i class="bi bi-inbox" style="font-size: 3rem; color: #9ca3af;"></i>
                    <p class="text-muted mt-3">No hay movimientos registrados</p>
                </div>

                <!-- Back button -->
                <a href="menu.html" class="btn btn-secondary btn-lg w-100 mt-3">
                    <i class="bi bi-arrow-left me-2"></i>Volver al Menú Principal
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./transactions.js"></script>
</body>
</html>
